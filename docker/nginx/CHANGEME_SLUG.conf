# Nginx EC2 의 /etc/nginx/conf.d/CHANGEME_SLUG.conf 에 배치한다.
# 적용: sudo nginx -t && sudo systemctl reload nginx
#
# 이 앱은 정적 파일까지 WAS 컨테이너가 서빙한다. /admin.html 이 Express 의
# Basic 인증을 통과해야 하므로 Nginx 가 public/ 을 직접 서빙하면 인증이
# 우회된다. 따라서 전부 프록시한다.

upstream CHANGEME_SLUG_was {
    server CHANGEME_WAS_PRIVATE_HOST:CHANGEME_HOST_PORT;
    keepalive 16;
}

server {
    listen 80;
    server_name CHANGEME_DOMAIN;

    # TLS 는 조직 표준(ACM+ALB 또는 certbot)에 따른다.
    # certbot 방식이면 아래 리다이렉트를 켜고 443 server 블록을 추가한다.
    # return 301 https://$host$request_uri;

    # 신청 폼과 관리자 조회뿐이라 업로드가 없다. 작게 유지한다.
    client_max_body_size 1m;

    location / {
        proxy_pass http://CHANGEME_SLUG_was;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # 헬스 체크는 외부에 노출하지 않는다. 배포 검증은 WAS 호스트 내부에서
    # 127.0.0.1:CHANGEME_HOST_PORT/api/health 로 수행한다.
    location = /api/health {
        return 404;
    }
}
