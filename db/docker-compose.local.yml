# 로컬 검증용 PostgreSQL. 운영에는 쓰지 않는다(운영 DB 는 RDS).
#
#   docker compose -f db/docker-compose.local.yml up -d          # 포트 충돌 시 LOCAL_DB_PORT=5433 를 앞에 붙인다
#   export TARGET_DATABASE_URL='postgresql://postgres:postgres@host.docker.internal:5432/blood_donation?sslmode=disable'
#   ./db/restore-postgres.sh backup/<타임스탬프>/app-tables.dump
#
# 앱을 로컬에서 띄울 때는 .env 에 DB_SSLMODE=disable 을 넣어야 한다.

name: blood-donation-local-db

services:
  postgres:
    image: postgres:17-alpine
    container_name: blood-donation-local-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blood_donation
    ports:
      # 5432 가 이미 쓰이면: LOCAL_DB_PORT=5433 docker compose -f db/docker-compose.local.yml up -d
      - "127.0.0.1:${LOCAL_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blood_donation"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
